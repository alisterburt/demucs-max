[project]
name = "demucs-mojo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alister Burt", email = "alisterburt@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dora-search>=0.1.12",
    "einops>=0.8.2",
    "julius>=0.2.8",
    "modular>=26.2.0",
    "numpy>=2.5.0",
    "openunmix>=1.3.0",
    "pyyaml>=6.0.3",
    "torch>=2.12.1",
    "torchaudio>=2.11.0",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
